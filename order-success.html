<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Confirmed - GreenAura</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="margin: 0; background-color: #f9fafb; font-family: sans-serif; display: flex; flex-direction: column; min-height: 100vh;">

    <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: white; border: 1px solid #e5e7eb; max-width: 480px; width: 100%; border-radius: 16px; padding: 40px 30px; text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.02);">
            
            <div style="background-color: #e6f6f0; color: #00a86b; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 25px auto;">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <h1 style="font-size: 1.6rem; color: #111827; margin: 0 0 10px 0; font-weight: 700;">Order Confirmed!</h1>
            <p style="color: #6b7280; font-size: 0.95rem; line-height: 1.5; margin: 0 0 30px 0;">
                
            </p>

            <div style="background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 18px; text-align: left; margin-bottom: 30px; font-size: 0.85rem;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px; color: #4b5563;">
                    <span>Order Serial Reference:</span>
                    <span style="font-weight: 600; color: #111827;" id="receiptId">GA-849204</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px; color: #4b5563;">
                    <span>Payment Status Channel:</span>
                    <span style="font-weight: 700; color: #00a86b;">SANDBOX CLEAR</span>
                </div>
                <div style="display: flex; justify-content: space-between; color: #4b5563;">
                    <span>Carbon Credits Saved:</span>
                    <span style="font-weight: 600; color: #00a86b;">+45 EcoPoints</span>
                </div>
            </div>

            <a href="marketplace.html" style="background-color: #111827; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-basket-shopping"></i> Return to Marketplace
            </a>
        </div>
    </main>

    <script>
        // Generate a random dynamic mock transaction receipt string code sequence for presentation
        document.getElementById('receiptId').textContent = 'GA-' + Math.floor(100000 + Math.random() * 900000);
    </script>
</body>
</html>
