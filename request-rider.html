<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Eco-Rider - GreenAura</title>
</head>
<body style="font-family: sans-serif; background-color: #f9fafb; padding: 40px 20px;">

    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; border: 1px solid #e5e7eb;">
        <h2 style="color: #00a86b; margin-top: 0;">🛵 Book an On-Demand Eco-Rider (Firebase Cloud)</h2>
        <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0;">

        <form id="riderForm">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Your Name:</label>
                <input type="text" id="sender_name" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Pick-up Address:</label>
                <textarea id="pickup_address" rows="3" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-family: sans-serif;"></textarea>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Category of Recyclables:</label>
                <select id="item_type" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;">
                    <option value="Electronics">E-Waste / Electronics</option>
                    <option value="Clothing">Pre-loved Clothes</option>
                    <option value="Books">Textbooks & Paper</option>
                </select>
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Estimated Weight (kg):</label>
                <input type="number" id="item_weight" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;">
            </div>

            <button type="submit" style="background-color: #00a86b; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem;">
                Confirm & Send to Cloud
            </button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="firebase-config.js"></script>

>
    <script>
        // Local Form Route Redirection
        function handleDeliverySubmit(event) {
            event.preventDefault();
            alert("🚀 Rider Hook Request Successfully Registered!\nYour on-demand courier dispatch has been queued. Returning you to the home dashboard portal.");
            window.location.href = "rider.html";
        }
    </script>

    <script src="cart.js"></script>
</body>
</html>
